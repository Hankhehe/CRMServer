{% extends "base.html" %}

{% block title %}刪除帳號 - CRM Server{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
  <div class="card" style="border-top: 4px solid #ef4444;">
    <h2 style="font-size: 1.35rem; color: #dc2626; margin-bottom: 1rem;">確認刪除使用者帳號</h2>
    <p style="font-size: 0.95rem; margin-bottom: 1.5rem;">
      確定要刪除帳號「<strong>{{ user_obj.username }}</strong>」嗎？此操作不可逆。
    </p>
    <form method="post" style="display: flex; justify-content: flex-end; gap: 0.75rem;">
      {% csrf_token %}
      <a href="{% url 'account-list' %}" class="btn btn-outline">取消</a>
      <button type="submit" class="btn btn-danger">確認刪除</button>
    </form>
  </div>
</div>
{% endblock %}
