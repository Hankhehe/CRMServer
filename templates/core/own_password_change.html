{% extends "base.html" %}

{% block title %}修改密碼 - CRM Server{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
  <div class="card">
    <h2 style="font-size: 1.35rem; margin-bottom: 1.25rem;"><i class="fa-solid fa-key"></i> 修改個人密碼</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div style="color: #ef4444; font-size: 0.8rem; margin-top: 0.25rem;">{{ field.errors.0 }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <a href="{% url 'dashboard' %}" class="btn btn-outline">取消</a>
        <button type="submit" class="btn btn-primary">確認修改</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
